version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: retail-forecasting-backend
    ports:
      - "8000:8000"
    environment:
      - MODEL_DIR=/app/saved_models
      - DATA_DIR=/app/data/uploads
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - ./backend/saved_models:/app/saved_models
      - ./backend/data:/app/data
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    networks:
      - retail-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: retail-forecasting-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - retail-network

  # Optional: PostgreSQL Database
  # postgres:
  #   image: postgres:15
  #   container_name: retail-forecasting-db
  #   environment:
  #     POSTGRES_DB: retail_forecasting
  #     POSTGRES_USER: admin
  #     POSTGRES_PASSWORD: changeme
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - retail-network

  # Optional: Redis Cache
  # redis:
  #   image: redis:7-alpine
  #   container_name: retail-forecasting-redis
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - retail-network

networks:
  retail-network:
    driver: bridge

volumes:
  postgres-data:
